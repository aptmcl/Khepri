# Root TagBot for the aptmcl/Khepri monorepo.
#
# Replaces the 14 inert copies at Julia/<Pkg>/.github/workflows/TagBot.yml
# (KhepriFrame4DD never had one).
#
# `ssh` matters: tags created with the default GITHUB_TOKEN do not trigger other
# workflows, so without it ci.yml's entire tag pathway -- the registry-resolution
# release test and the versioned/stable docs deploy -- silently never runs.
# DOCUMENTER_KEY is the base64 private half of the repository deploy key added
# 2026-08-04; the same secret drives deploydocs (ci.yml) and CompatHelper.
#
# TagBot is a per-package invocation: `subdir` is a plain string, not a list, so
# the packages go in a matrix. `tag_prefix` is deliberately omitted -- with
# `subdir` set and `tag_prefix` empty, TagBot derives the prefix from that
# subdirectory's Project.toml name and produces <Package>-v<version>, which is
# exactly what the migration's --tag-rename already produced. Setting it by hand
# would only create somewhere for the two to drift apart.
#
# There is deliberately no `permissions:` block; TagBot's README says to use the
# defaults.
#
# Note: a package that is not in General makes TagBot log "This package is not
# registered, skipping" and exit 0. Ten of these fifteen are in that state today,
# so a green run here does not mean a tag was created.

name: TagBot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  # The package list is DERIVED from Julia/*/Project.toml, not hardcoded:
  # the old 15-name list silently omitted Frame4DD, KhepriSVG, and
  # KhepriThebes, and every new package would have repeated the omission.
  packages:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          pkgs=$(ls -d Julia/*/Project.toml | sed 's|Julia/||;s|/Project.toml||' | jq -R . | jq -sc .)
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"

  TagBot:
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # An arbitrary hedge against GITHUB_TOKEN secondary rate limits during
      # changelog generation, not a measured number.
      max-parallel: 4
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          subdir: Julia/${{ matrix.package }}
